<!-- 【文件说明】初始化流程窗（setup window）的入口 HTML：
     与桌宠窗（src/index.html）分离，避免透明背景样式污染登录/测试 UI。
     Vite 多入口构建会把它打成 out/renderer/setup/index.html。 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Petibi 初始化</title>
    <style>
      /* setup 窗是普通应用窗口，使用浅色纸感底色，与桌宠的透明底色完全隔离 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fafaf7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: #2a2a28;
        -webkit-font-smoothing: antialiased;
        height: 100%;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
