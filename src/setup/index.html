<!-- 【文件说明】初始化流程窗（setup window）的入口 HTML（T3 工单：DESIGN.md v1）：
     与桌宠窗（src/index.html）分离，避免透明背景样式污染登录/测试 UI。
     Vite 多入口构建会把它打成 out/renderer/setup/index.html。
     现在 setup 窗是 frame:false（无边框），由 src/components/TitleBar.tsx 自绘标题栏。 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Petibi 初始化</title>
    <style>
      /* setup 窗基础样式：与桌面像素风调色板对齐；具体控件由 styles.css 接管 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fef9ef;
        color: #2b2320;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
