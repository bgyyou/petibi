<!-- 【文件说明】渲染进程入口页面：透明背景 + React 挂载点，桌宠组件在 src/App.tsx -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Petibi</title>
    <style>
      /* 页面本身必须全透明，壁纸才能透过 Electron 透明窗显示出来 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        /* 防止拖拽时选中文字/图片 */
        user-select: none;
        -webkit-user-select: none;
      }
      /* 桌宠根容器：让快捷菜单气泡可以溢出到桌宠 sprite 之外 */
      .pet-root {
        position: relative;
      }
      /* 快捷菜单气泡：贴在桌宠右侧，约 140×160 像素风小窗（DESIGN.md §3 / 工单 A4 / T3 工单第 3 条） */
      .pet-quick-menu {
        position: absolute;
        top: 0;
        left: 132px;
        width: 144px;
        background: #fef9ef;
        border: 3px solid #2b2320;
        border-radius: 0;
        box-shadow: 4px 4px 0 #2b2320;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 10;
        font-family: 'PetibiPixel', -apple-system, BlinkMacSystemFont, 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .pet-quick-item {
        font-family: inherit;
        font-size: 12px;
        padding: 6px 8px;
        border: 2px solid transparent;
        background: transparent;
        border-radius: 0;
        color: #2b2320;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 80ms ease-out, border-color 80ms ease-out;
        letter-spacing: 0.5px;
      }
      .pet-quick-item:hover {
        background: #f1ebf6;
        border-color: #2b2320;
      }
      .pet-quick-item svg {
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
