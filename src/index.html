<!-- 【文件说明】渲染进程入口页面：透明背景 + React 挂载点，桌宠组件在 src/App.tsx -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Petibi</title>
    <style>
      /* 页面本身必须全透明，壁纸才能透过 Electron 透明窗显示出来 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        /* 防止拖拽时选中文字/图片 */
        user-select: none;
        -webkit-user-select: none;
      }
      /* 桌宠根容器：让快捷菜单气泡可以溢出到桌宠 sprite 之外 */
      .pet-root {
        position: relative;
      }
      /* 快捷菜单气泡：贴在桌宠右侧，约 120×160 透明小窗（PRD §2 / 工单 A4） */
      .pet-quick-menu {
        position: absolute;
        top: 0;
        left: 128px;
        width: 140px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #ece7da;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        z-index: 10;
        backdrop-filter: blur(6px);
      }
      .pet-quick-item {
        font-family: inherit;
        font-size: 12px;
        padding: 8px 10px;
        border: none;
        background: transparent;
        border-radius: 6px;
        color: #2a2a28;
        text-align: left;
        cursor: pointer;
        transition: background 100ms ease;
      }
      .pet-quick-item:hover {
        background: #f4efe2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
